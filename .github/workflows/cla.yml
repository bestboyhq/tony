name: CLA

# Every contributor signs CLA.md once, with a comment on their first pull request (ADR 0011).
# CLA Assistant Lite keeps the signatures in signatures/cla.json on the cla-signatures branch, so main's branch protection never blocks it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write # reruns the failed check once a contributor signs
  contents: write # commits signatures to cla-signatures
  pull-requests: write # comments, and locks merged pull requests so a signature comment can't be deleted
  statuses: write

jobs:
  cla:
    # pull_request_target runs with write access, so nothing here checks out or runs the pull request's code.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # The action fails on its first run unless the signatures file exists (contributor-assistant/github-action#155),
      # so the first run makes the branch: one root commit holding an empty list, sharing no history with main.
      - name: Create the signatures branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/branches/cla-signatures" --silent 2> /dev/null && exit 0
          tree=$(gh api "repos/$REPO/git/trees" --input - --jq .sha <<< '{"tree": [{"path": "signatures/cla.json", "mode": "100644", "type": "blob", "content": "{\"signedContributors\": []}\n"}]}')
          commit=$(gh api "repos/$REPO/git/commits" -f message='Create the CLA signatures file' -f tree="$tree" --jq .sha)
          # A run for another pull request may have made it a moment ago.
          gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$commit" --silent || gh api "repos/$REPO/branches/cla-signatures" --silent
      # The last release, v2.6.1; the repository is archived, so the pin never moves.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/bestboyhq/tony/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: szymeo,*[bot]
